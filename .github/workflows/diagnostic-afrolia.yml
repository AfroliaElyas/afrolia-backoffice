name: Diagnostic Afrolia (lecture seule)

# Déclenché uniquement à la main (jamais automatiquement). La clé SSH utilisée
# ici est une clé DÉDIÉE et RESTREINTE côté serveur par une "forced command"
# dans authorized_keys : quelle que soit la commande demandée depuis ce fichier
# (ou depuis n'importe où ailleurs avec cette même clé), le serveur exécute
# toujours et uniquement /home/forge/diagnostic-afrolia.sh — un script fixe,
# en lecture seule, qui ne prend aucun paramètre. Cette clé ne peut donc pas
# être détournée pour exécuter une autre commande, même en cas de fuite du
# secret GitHub ou de modification de ce fichier.
#
# Un seul secret GitHub est nécessaire : FORGE_SSH_PRIVATE_KEY (la clé privée
# correspondante — jamais la clé principale du compte Forge).
#
# Aucun secret (clé SSH, identifiants Backblaze/DB) n'apparaît jamais dans les
# journaux : aucune commande ci-dessous ne les affiche, et backblaze:diagnostiquer
# est lui-même conçu pour ne jamais les révéler en clair.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORGE_SSH_HOST: "164.92.230.201"
  FORGE_SSH_USER: "forge"

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Prépare la clé SSH (fichier temporaire, jamais affiché, supprimé en fin de job)
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.FORGE_SSH_PRIVATE_KEY }}" > ~/.ssh/afrolia_diagnostic
          chmod 600 ~/.ssh/afrolia_diagnostic
          ssh-keyscan -H "$FORGE_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Lance le diagnostic (la clé force toujours ce script précis, rien d'autre)
        run: |
          ssh -i ~/.ssh/afrolia_diagnostic "$FORGE_SSH_USER@$FORGE_SSH_HOST" "diagnostic afrolia"
          # Le texte "diagnostic afrolia" ci-dessus n'a aucune importance :
          # la "forced command" côté serveur ignore tout ce qui est demandé
          # et exécute toujours /home/forge/diagnostic-afrolia.sh à la place.

      - name: Supprime la clé SSH temporaire
        if: always()
        run: rm -f ~/.ssh/afrolia_diagnostic
