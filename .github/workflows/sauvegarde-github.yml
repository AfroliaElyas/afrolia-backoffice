name: Sauvegarde GitHub (récupération + publication + vérification réelle)

# Récupère les fichiers chiffrés déjà produits par le cron Laravel
# existant (sauvegarde:github, routes/console.php, 00h20 UTC) via la clé
# SSH DÉJÀ EXISTANTE et déjà restreinte par une "forced command"
# (FORGE_SSH_PRIVATE_KEY — même secret, même mécanisme que
# diagnostic-afrolia.yml) : aucune nouvelle clé, aucun nouveau secret SSH.
# L'action demandée au serveur (recuperer-sauvegarde-github, voir
# deploy/diagnostic-afrolia.sh) ne fait que LIRE des fichiers déjà
# présents — jamais d'écriture, jamais de commande arbitraire.
#
# La publication vers GitHub (création de la Release, envoi des pièces
# jointes, purge des anciennes au-delà de 90 jours) utilise le jeton
# AUTOMATIQUE GITHUB_TOKEN, fourni par GitHub Actions pour ce dépôt à
# chaque exécution puis détruit à la fin — jamais un jeton personnel à
# créer ou coller dans Forge.
#
# Ajouté le 13/11/2026 : une vérification locale (côté serveur, avant
# tout envoi) ne prouve pas que la copie réellement stockée sur GitHub
# est récupérable — seulement que la copie produite sur le serveur
# l'était. Ce workflow télécharge donc maintenant la pièce jointe
# FRAÎntCHEMENT depuis la Release qu'il vient de publier (jamais le
# fichier local déjà en main), la déchiffre, et restaure réellement la
# base dans un conteneur MySQL éphémère (services ci-dessous, détruit à
# la fin du job, aucun rapport avec la base de production) + extrait les
# photos — avant de purger quoi que ce soit. Nécessite le secret
# SAUVEGARDE_GITHUB_CLE (la même clé de chiffrement que celle de Forge,
# dupliquée ici dans le coffre à secrets GitHub — jamais affichée dans
# les journaux, GitHub masque automatiquement toute valeur de secret qui
# apparaîtrait en sortie).

on:
  schedule:
    # 00h40 UTC : 20 minutes après le cron Laravel (00h20), le temps que
    # mysqldump + compression + chiffrement des photos se terminent.
    - cron: '40 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORGE_SSH_HOST: "164.92.230.201"
  FORGE_SSH_USER: "forge"

jobs:
  sauvegarde:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: verif-sauvegarde-github-ephemere
          MYSQL_DATABASE: verif_sauvegarde_github
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Prépare la clé SSH (fichier temporaire, jamais affiché, supprimé en fin de job)
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.FORGE_SSH_PRIVATE_KEY }}" > ~/.ssh/afrolia_diagnostic
          chmod 600 ~/.ssh/afrolia_diagnostic
          ssh-keyscan -H "$FORGE_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Récupère le manifeste et les fichiers chiffrés (lecture seule sur le serveur)
        run: |
          ssh -i ~/.ssh/afrolia_diagnostic "$FORGE_SSH_USER@$FORGE_SSH_HOST" "recuperer-sauvegarde-github" > sortie_brute.txt
          # Le texte "recuperer-sauvegarde-github" ci-dessus n'a d'effet que
          # parce que la "forced command" côté serveur le reconnaît comme une
          # des actions allowlistées ; toute autre commande serait rejetée.

          mkdir -p fichiers
          while IFS=' ' read -r type reste; do
            case "$type" in
              MANIFEST)
                printf '%s\n' "$reste" > manifest.json
                ;;
              FICHIER)
                nom="${reste%% *}"
                b64="${reste#* }"
                printf '%s' "$b64" | base64 -d > "fichiers/$nom"
                ;;
            esac
          done < sortie_brute.txt

          if [ ! -f manifest.json ]; then
            echo "ÉCHEC : aucun manifeste reçu — sortie du serveur ci-dessous :" >&2
            cat sortie_brute.txt >&2
            exit 1
          fi

      - name: Vérifie l'intégrité des fichiers reçus (empreinte SHA-256 du manifeste)
        run: |
          jq -r '.fichiers[] | "\(.sha256)  fichiers/\(.nom)"' manifest.json > sommes_attendues.txt
          cat sommes_attendues.txt
          sha256sum -c sommes_attendues.txt

      - name: Publie la Release GitHub si elle n'existe pas déjà (GITHUB_TOKEN automatique — jamais de jeton personnel)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(jq -r '.tag' manifest.json)
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "La release $TAG existe déjà — rien à republier (nouvelle exécution du même jour, ou re-déclenchement manuel)."
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Sauvegarde chiffrée $TAG" \
              --notes "Sauvegarde automatique chiffrée (base + photos). Clé de déchiffrement non stockée ici." \
              --prerelease \
              fichiers/*
            echo "Release $TAG créée avec $(ls fichiers | wc -l) fichier(s)."
          fi

      - name: Vérifie la récupération RÉELLE depuis GitHub (téléchargement frais + déchiffrement + restauration isolée)
        env:
          GH_TOKEN: ${{ github.token }}
          SAUVEGARDE_GITHUB_CLE_OPENSSL: ${{ secrets.SAUVEGARDE_GITHUB_CLE }}
        run: |
          if [ -z "$SAUVEGARDE_GITHUB_CLE_OPENSSL" ]; then
            echo "ÉCHEC : le secret SAUVEGARDE_GITHUB_CLE n'est pas configuré dans ce dépôt (Settings > Secrets and variables > Actions) — vérification réelle impossible." >&2
            exit 1
          fi

          rm -rf verif_telecharge && mkdir verif_telecharge
          # Téléchargement FRAIS depuis la Release qui vient d'être publiée —
          # jamais les fichiers déjà en main localement (fichiers/) : ceci
          # prouve que la copie réellement stockée par GitHub est
          # récupérable, pas seulement celle produite sur le serveur.
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir verif_telecharge --clobber

          echo "=== Fichiers téléchargés depuis la Release (fraîchement, pas depuis le cache local) ==="
          ls -la verif_telecharge

          echo
          echo "=== Vérifie que le contenu téléchargé est bien identique à celui envoyé (empreinte SHA-256) ==="
          (cd verif_telecharge && jq -r '.fichiers[] | "\(.sha256)  \(.nom)"' ../manifest.json > ../sommes_telecharge.txt)
          (cd verif_telecharge && sha256sum -c ../sommes_telecharge.txt)

          for fichier in verif_telecharge/*; do
            nom=$(basename "$fichier")
            dechiffre="verif_telecharge/dechiffre-${nom%.enc}"
            if ! openssl enc -d -aes-256-cbc -pbkdf2 -in "$fichier" -out "$dechiffre" -pass env:SAUVEGARDE_GITHUB_CLE_OPENSSL; then
              echo "ÉCHEC : déchiffrement impossible pour $nom (clé incorrecte, ou fichier corrompu)." >&2
              exit 1
            fi

            case "$nom" in
              *-db-*)
                gunzip -f "$dechiffre"
                dump="${dechiffre%.gz}"
                if ! mysql -h 127.0.0.1 -P 3306 -u root -proot verif_sauvegarde_github < "$dump"; then
                  echo "ÉCHEC : la restauration de la base téléchargée depuis GitHub a échoué." >&2
                  exit 1
                fi
                NB_TABLES=$(mysql -h 127.0.0.1 -P 3306 -u root -proot -N -e 'SHOW TABLES;' verif_sauvegarde_github | wc -l)
                if [ "$NB_TABLES" -lt 1 ]; then
                  echo "ÉCHEC : la base restaurée depuis la copie GitHub ne contient aucune table." >&2
                  exit 1
                fi
                echo "✅ Base restaurée depuis la copie GitHub (fraîchement téléchargée) : $NB_TABLES table(s)."
                ;;
              *-photos-*)
                mkdir -p verif_telecharge/photos-extraites
                if ! tar -xzf "$dechiffre" -C verif_telecharge/photos-extraites; then
                  echo "ÉCHEC : extraction des photos téléchargées depuis GitHub impossible (archive corrompue)." >&2
                  exit 1
                fi
                NB_PHOTOS=$(find verif_telecharge/photos-extraites -type f | wc -l)
                echo "✅ Photos extraites depuis la copie GitHub (fraîchement téléchargée) : $NB_PHOTOS fichier(s)."
                ;;
            esac
          done

          echo
          echo "✅ VÉRIFIÉ : la copie réellement stockée sur GitHub (release $TAG) a été téléchargée, déchiffrée et restaurée avec succès — pas seulement la copie locale avant envoi."

      - name: Purge les anciennes releases de sauvegarde au-delà de la conservation (90)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASES=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName | jq -r '.[] | select(.tagName | startswith("sauvegarde-")) | .tagName' | sort)
          TOTAL=$(printf '%s\n' "$RELEASES" | grep -c . || true)
          A_CONSERVER=90

          if [ "$TOTAL" -gt "$A_CONSERVER" ]; then
            A_SUPPRIMER=$((TOTAL - A_CONSERVER))
            printf '%s\n' "$RELEASES" | head -n "$A_SUPPRIMER" | while read -r tag; do
              echo "Suppression de l'ancienne release : $tag"
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes
            done
          else
            echo "Rien à purger ($TOTAL sauvegarde(s), conservation : $A_CONSERVER)."
          fi

      - name: Nettoyage (clé SSH, fichiers locaux au runner, y compris le contenu déchiffré)
        if: always()
        run: |
          rm -f ~/.ssh/afrolia_diagnostic
          rm -rf fichiers manifest.json sortie_brute.txt sommes_attendues.txt sommes_telecharge.txt verif_telecharge
