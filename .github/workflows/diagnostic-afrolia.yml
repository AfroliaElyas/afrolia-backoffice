name: Diagnostic Afrolia (lecture seule)

# Déclenché uniquement à la main (jamais automatiquement) : sert à faire tourner
# des diagnostics en lecture seule sur le serveur Forge de production, sans
# jamais rien y modifier, sans déploiement, et sans qu'aucun secret (clé SSH,
# identifiants Backblaze/DB) n'apparaisse jamais dans les journaux.
#
# Un seul secret GitHub est nécessaire : FORGE_SSH_PRIVATE_KEY (la clé privée
# d'une paire SSH dédiée à cet usage, dont la clé publique est ajoutée dans
# Forge > SSH Keys — jamais la clé principale du compte).
#
# Chaque étape ci-dessous est volontairement une simple lecture (git log,
# readlink, une commande Artisan déjà conçue pour ne jamais afficher de
# secret) : aucune écriture sur le serveur, aucune commande destructrice,
# pas de sudo. Toute nouvelle étape ajoutée ici passe par une Pull Request
# comme le reste du code, donc reste visible et review-able avant d'exister.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORGE_SSH_HOST: "164.92.230.201"
  FORGE_SSH_USER: "forge"
  FORGE_SITE_DIR: "/home/forge/afrolia-app.com/current"

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Prépare la clé SSH (fichier temporaire, jamais affiché, supprimé en fin de job)
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.FORGE_SSH_PRIVATE_KEY }}" > ~/.ssh/afrolia_diagnostic
          chmod 600 ~/.ssh/afrolia_diagnostic
          ssh-keyscan -H "$FORGE_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Connexion de test (lecture seule) — confirme juste que la clé fonctionne
        run: |
          ssh -i ~/.ssh/afrolia_diagnostic "$FORGE_SSH_USER@$FORGE_SSH_HOST" "whoami && echo 'Connexion SSH OK (lecture seule).'"

      - name: Dernier commit réellement déployé
        run: |
          ssh -i ~/.ssh/afrolia_diagnostic "$FORGE_SSH_USER@$FORGE_SSH_HOST" \
            "cd $FORGE_SITE_DIR && git log -1 --format='Commit déployé : %H (%ad) — %s' --date=iso"

      - name: Vérifie que storage/ est bien persistant entre les déploiements
        run: |
          ssh -i ~/.ssh/afrolia_diagnostic "$FORGE_SSH_USER@$FORGE_SSH_HOST" \
            "cd $FORGE_SITE_DIR && echo -n 'storage -> ' && readlink -f storage"

      - name: Diagnostic Backblaze (commande dédiée, ne révèle jamais les secrets)
        run: |
          ssh -i ~/.ssh/afrolia_diagnostic "$FORGE_SSH_USER@$FORGE_SSH_HOST" \
            "cd $FORGE_SITE_DIR && php artisan backblaze:diagnostiquer"

      - name: Supprime la clé SSH temporaire
        if: always()
        run: rm -f ~/.ssh/afrolia_diagnostic
